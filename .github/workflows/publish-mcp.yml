name: Publish to the MCP Registry

# Publishes server.json to registry.modelcontextprotocol.io as
# io.github.markksantos/ai-model-watch. GitHub OIDC proves the namespace, so no
# token or secret is stored. Before running it for a new version: attach the
# .mcpb (npx @anthropic-ai/mcpb pack) to the release and update the version,
# URL and fileSha256 in server.json.

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check the release asset matches server.json
        run: |
          curl -fsSL "$(jq -r '.packages[0].identifier' server.json)" -o bundle.mcpb
          echo "$(jq -r '.packages[0].fileSha256' server.json)  bundle.mcpb" | sha256sum -c -

      - name: Install mcp-publisher
        run: curl -fsSL https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz | tar xz mcp-publisher

      - name: Log in with GitHub OIDC
        run: ./mcp-publisher login github-oidc

      - name: Publish
        run: ./mcp-publisher publish
